name: Build & Deploy to UAT

on:
  push:
    branches: [ uat ]
  workflow_dispatch:  # Allow manual triggering

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west2
  SERVICE_NAME: fincore-uat-api
  IMAGE_NAME: fincore-api
  VPC_CONNECTOR: uat-connector

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    environment: fincore-gcp-secretes
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Build with Maven
        run: mvn clean package -DskipTests -Dmaven.test.skip=true -q
        
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jar-artifact
          path: target/user-management-api-1.0.0.jar
          retention-days: 1

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    environment: fincore-gcp-secretes
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          
      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker gcr.io
          
      - name: Build Docker image
        run: |
          docker build -t gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:uat \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:uat-${{ github.sha }} \
            .
            
      - name: Push Docker image to GCR
        run: |
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:uat
          docker push gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:uat-${{ github.sha }}
          
      - name: Output image digest
        run: |
          echo "Image pushed: gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:uat"
          echo "SHA tag: uat-${{ github.sha }}"

  deploy-uat:
    name: Deploy to Cloud Run UAT
    runs-on: ubuntu-latest
    needs: docker-build-push
    
    permissions:
      contents: read
      
    environment:
      name: fincore-gcp-secretes
      url: ${{ steps.deploy.outputs.service_url }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:uat \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --memory=1Gi \
            --cpu=1 \
            --timeout=900 \
            --cpu-boost \
            --max-instances=3 \
            --min-instances=0 \
            --vpc-connector=${{ env.VPC_CONNECTOR }} \
            --vpc-egress=private-ranges-only \
            --set-env-vars="DB_NAME=fincore_db,DB_HOST=${{ secrets.UAT_DB_HOST }},DB_USER=${{ secrets.UAT_DB_USER }},DB_PASSWORD=${{ secrets.UAT_DB_PASSWORD }},SPRING_PROFILES_ACTIVE=uat,GCS_ENABLED=true,GCS_BUCKET_NAME=fincore-uat-kyc-documents,GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
            --port=8080 \
            --no-cpu-throttling \
            --project=${{ env.PROJECT_ID }}
            
      - name: Get service URL
        id: url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "🚀 Service deployed to: $SERVICE_URL"
          
      - name: Health check
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          
          echo "⏳ Waiting for service to be ready..."
          for i in {1..30}; do
            if curl -sf $SERVICE_URL/actuator/health > /dev/null; then
              echo "✅ Service health check passed"
              exit 0
            fi
            echo "Attempt $i/30: Service not ready yet, waiting..."
            sleep 10
          done
          echo "❌ Service health check failed after 5 minutes"
          exit 1
          
      - name: Deployment summary
        if: success()
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          
          echo "================================================"
          echo "🎉 UAT Deployment Successful!"
          echo "================================================"
          echo "Environment: UAT"
          echo "Service: ${{ env.SERVICE_NAME }}"
          echo "URL: $SERVICE_URL"
          echo "Region: ${{ env.REGION }}"
          echo "Image: gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:uat"
          echo "================================================"
